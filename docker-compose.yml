# version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "8888:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
    container_name: php_container
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      # JWT Configuration
      - JWT_SECRET=psicomanager_super_secret_key
      - JWT_EXPIRATION=3600
      - JWT_REFRESH_EXPIRATION=2592000
      - JWT_ISSUER=http://localhost:8888
      - JWT_AUDIENCE=psicomanager-api
    depends_on:
      - mysql
    networks:
      - app-network
    # command: >
    #   sh -c "
    #   php artisan migrate --force &&
    #   php artisan db:seed &&
    #   php-fpm
    #   "

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: psico_case
      MYSQL_USER: lumen
      MYSQL_PASSWORD: lumen
    ports:
      - "3306:3306"
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    networks:
      - app-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
